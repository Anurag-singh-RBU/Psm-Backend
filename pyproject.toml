[project]
name = "psm-backend"
version = "1.0.0"
description = "Backend for the Productive Social Media"
readme = "README.md"
authors = [
    { name = "Anurag-singh-RBU", email = "anuragsingh260805@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
]